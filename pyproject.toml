[project]
name = "casys-trader"
version = "0.1.0"
description = "Agent de trading autonome (Codex brain) — paper trading"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
casys-trader = "trader.daemon:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trader"]
