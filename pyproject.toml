[project]
name = "casys-trader"
version = "0.1.0"
description = "Agent de trading autonome (Codex brain) — paper trading"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pyyaml>=6.0",
    "rich>=13.0",
    "plotext>=5.2",
    "ib-async>=2.1.0",
    "textual>=8.2.7",
    "exchange-calendars>=4.13.2",
]

[project.scripts]
casys-trader = "trader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trader"]
