schema_version: world_macro_derivation_policy.v1
producer_version: world_macro_source.v1
transform_version: macro_regimes.v1
authority: shadow_only
decision_effect: none
content_sha256: "d739a76d125f61419434fa4234f2fd03185d6c90239c4a404faa41308d2419c2"

vocabularies:
  macro_regime: [unknown, mixed, quiet, tightening, easing]
  rates_regime: [unknown, stable, rising, falling]
  usd_regime: [unknown, strong, weak, stable]

dimensions:
  rates_regime:
    method: last_two_admissible_points_delta_pp
    metric_keys: [policy_rate]
    rising_if_delta_pp_ge: 0.125
    falling_if_delta_pp_le: -0.125
    stable_if_abs_delta_pp_lt: 0.125
    min_fresh_sources: 1
    on_conflict: unknown
    on_single_point: unknown
  usd_regime:
    method: always_unknown
    value: unknown
    missing_source_ids: [broad_usd_index]
  macro_regime:
    method: always_unknown_until_inflation_yoy_proven
    value: unknown
    do_not_infer_yoy_from_single_index_level: true
    do_not_use_front_month_futures: true

coverage:
  complete_requires_all_required_fresh: true
  insufficient: unknown
  never_optimistic_fill: true
