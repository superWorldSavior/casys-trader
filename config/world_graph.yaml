schema_version: world_graph.v1
content_sha256: "171bc168103dd322bdb37584b5f2131293afef531cbc6190a24a4eb6712b5260"
authority: shadow_only
decision_effect: none
causal_claim: false
ontology_revision: market_ontology.v1
traversal_policy_version: graph_traversal.v1

scope_mapping:
  mapping_id: world_scope_mapping.v1

instrument_id_rule: "mic:<MIC>:symbol:<universe_symbol>"
issuer_identity:
  allowed_prefixes: [lei, cik, issuer]
  forbidden: [isin, issuer_name]
  providers:
    - sec_edgar
    - company_entities
  isin_is_instrument_only: true

family_edge: categorical_asset_family_frozen_at_capture

traversal:
  max_depth: 4
  max_paths_per_root: 32
  cycles: forbid
  tie_break: relation_id_lexical
  reverse_structural_allowed: [LOCATED_IN, TRADED_ON]
  forward_structural: [PART_OF_WORLD, LOCATED_IN, TRADED_ON, ISSUED_BY, MEMBER_OF_FAMILY]
  knowledge: [ABOUT, OBSERVES, DERIVED_FROM, SUPERSEDES, USES]
  forbidden_factual: [CAUSES, HYPOTHESIZED_INFLUENCE]
  freshness_buckets: ["0-4h", "4-24h", "1-7d", older]
  path_signature: [kinds, relation, direction, freshness_bucket]

windows_and_decay:
  windows: ["0-4h", "4-24h", "1-7d", older]
  decay: none
  aggregates: counts_on_snapshot_members_only

feature_profiles_planned:
  - topology_status_only
  - graph_content

negative_controls:
  - topology_status_only
  - entity_permutation_within_venue_session
  - block_respecting_time_shift
  - truncated_chain
  - comparable_population_without_event

multiplicity:
  method: holm_bonferroni
  family_wise_alpha: 0.05
  frozen_before: GRAPH-7

closure_rule:
  kind: evaluation_closed_when_collection_closed_and_all_pattern_horizons_terminal

cohort_id: null
