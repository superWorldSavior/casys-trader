schema_version: macro_source_registry.v1
registry_version: macro_sources.v1
authority: shadow_only
decision_effect: none
producer_version: macro_source_only.v1
content_sha256: "00219ea60f1a95b3fdc58282b100775c3bff493d7e21713af63f1e1dc6cd6ee6"
operator_config_sha256: "9f6193744bd189b35bd70ee5421743b52fce4be462fbfbbc96494c050ad8d535"

budgets:
  worker: single_flight
  fetch_in_run_cycle: false
  fetch_in_world_capture_worker: false
  max_parallel_requests: 1
  retry_max: 1
  honor_retry_after: true
  on_429_or_timeout: missing
  providers:
    dbnomics:
      base: "https://api.db.nomics.world/v22"
      cooldown_h: 24
      timeout_s: 5
      min_interval_s: 2
      observations: 1
    yahoo_finance:
      base: "https://query1.finance.yahoo.com/v8/finance/chart/"
      cooldown_h: 24
      timeout_s: 8
      min_interval_s: 5
      range: 5d
      interval: 1d

declared_gaps:
  - broad_usd_index
  - taiwan_policy_rate
  - taiwan_cpi
  - growth_series
excluded_providers:
  - gdelt
  - news_macro_brief
  - fred
  - ecbdata
  - oecd

retention:
  facts: keep_all
  observations: keep_all
  run_events: keep_all

ttl:
  series_point_daily_h: 72
  series_point_monthly_d: 40
  market_benchmark_daily_h: 72

entries:
  - source_id: fed_funds_effective
    provider_id: dbnomics
    provider_entity_id: FED/H15/RIFSPFF_N.D
    canonical_scope: {kind: country, entity_id: "iso-3166:US"}
    adapter_version: dbnomics_series.v1
    fact_kind: series_point
    metric_key: policy_rate
  - source_id: cpi_us_imf
    provider_id: dbnomics
    provider_entity_id: IMF/CPI/M.US.PCPI_IX
    canonical_scope: {kind: country, entity_id: "iso-3166:US"}
    adapter_version: dbnomics_series.v1
    fact_kind: series_point
    metric_key: cpi_index
  - source_id: ecb_deposit_rate
    provider_id: dbnomics
    provider_entity_id: ECB/FM/B.U2.EUR.4F.KR.DFR.LEV
    canonical_scope: {kind: region, entity_id: "iso-un-m49:150"}
    adapter_version: dbnomics_series.v1
    fact_kind: series_point
    metric_key: policy_rate
  - source_id: hicp_euro_area
    provider_id: dbnomics
    provider_entity_id: Eurostat/prc_hicp_midx/M.I15.CP00.EA20
    canonical_scope: {kind: region, entity_id: "iso-un-m49:150"}
    adapter_version: dbnomics_series.v1
    fact_kind: series_point
    metric_key: cpi_index
  - source_id: unemployment_rate_us
    provider_id: dbnomics
    provider_entity_id: BLS/ln/LNS14000000
    canonical_scope: {kind: country, entity_id: "iso-3166:US"}
    adapter_version: dbnomics_series.v1
    fact_kind: series_point
    metric_key: unemployment_rate
  - source_id: brent_crude_usd
    provider_id: yahoo_finance
    provider_entity_id: BZ=F
    canonical_scope: {kind: world, entity_id: market}
    adapter_version: yahoo_commodity.v1
    fact_kind: market_benchmark
    metric_key: brent_front_month_usd
  - source_id: gold_usd
    provider_id: yahoo_finance
    provider_entity_id: GC=F
    canonical_scope: {kind: world, entity_id: market}
    adapter_version: yahoo_commodity.v1
    fact_kind: market_benchmark
    metric_key: gold_front_month_usd
