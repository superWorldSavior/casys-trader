# Univers de trading — édité en boucle 1 (Erwan + Claude).
# v1 : instruments disponibles via yfinance (data gratuite, démarrage immédiat).
# Expansion native (Euronext Paris, Taïwan, FX broker) une fois IB Gateway branchée.

starting_cash: 100000

# Univers resserré 2026-06-08 : 28 → 15 symboles. On retire les doublons
# corrélés (un représentant par facteur de risque), on conserve le panier TW.
# Coupés : DIA, EWT, EWQ, ITA, XLE, BZ=F, AAPL, GBPUSD, USDCHF, USDCAD,
# AUDUSD, NZDUSD, EURJPY. (Contrats toujours définis dans ib_contracts.yaml
# pour ré-expansion ultérieure.)
symbols:
  # Indices (via ETF)
  - SPY   # S&P 500
  - QQQ   # Nasdaq 100
  - ^FCHI # CAC 40
  # Commodities futures continus (proxy paper Yahoo Finance)
  - CL=F  # WTI crude oil
  - NG=F  # Natural gas
  # Métaux précieux (future COMEX, ~24/5)
  - GC=F  # Gold
  # Nasdaq individuelle (pari direct ; tendance tech large déjà via QQQ)
  - NVDA
  # Forex majors (Yahoo Finance FX spot proxy) — resserré à 2 paires non redondantes
  - EURUSD=X
  - USDJPY=X
  # Actions taïwanaises (TWSE, TWD) — data IB confirmée 2026-06-08
  - 2330.TW   # TSMC (semi)
  - 2317.TW   # Hon Hai / Foxconn (electronics)
  - 2454.TW   # MediaTek (semi)
  - 2412.TW   # Chunghwa Telecom (telecom)
  - 2882.TW   # Cathay Financial (finance)
  - 2603.TW   # Evergreen Marine (shipping)
