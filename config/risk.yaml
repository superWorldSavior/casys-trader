# Risk gate — le FUSIBLE (codé en dur dans trader/execution/risk.py, paramétré ici).
# Ce ne sont PAS les règles de stratégie de l'agent : ce sont les bornes externes
# qui empêchent un bug de tout casser. Valeurs prudentes par défaut (paper).

max_position_value: 50000      # $ max par position (profil paper agentic permissif)
max_gross_exposure: 100000     # $ max exposition brute totale
max_order_value: 50000         # $ max par ordre unique (profil paper agentic permissif)
max_risk_per_trade_pct: 0.01   # 1% du capital risqué par trade (distance au stop), SI un stop existe
min_equity: 50000              # plancher : sous ce seuil, plus aucun ordre

# --- Mode exploration / calibration (PAPER uniquement) ---
# Politique d'entrée lisible en un seul endroit :
#   - TradePlanEvaluation : REQUIRED en code pour toute hausse d'exposition.
#   - economics / EV : ADVISORY (une EV négative ne bloque pas).
#   - confidence gate : seul interrupteur ci-dessous ; indépendant de l'EV.
# Spec : docs/superpowers/specs/2026-06-24-exploration-basse-confiance-calibration-design.md
# La confiance ne gate plus la taille : c'est une prédiction pure mesurée ex-post
# (buckets by_confidence de l'attribution, non censurés). Un profil LIVE doit
# remettre ces deux flags à true et fournir des plafonds prudents.
confidence_gate_enabled: false # false → le gate confiance ne rejette plus aucun ordre
require_hard_stop: false       # false → ouverture sans hard_stop autorisée (bornée par le notionnel)

# Seuils conservés pour référence / réactivation live (inertes tant que le gate est off) :
#   required = min_trade_confidence + (full_risk_confidence − min_trade_confidence)
#              × clamp(planned_risk_pct / max_risk_per_trade_pct, 0, 1)
min_trade_confidence: 0.7      # confiance minimale (risque nul)
full_risk_confidence: 0.9      # confiance exigée au budget complet ou sans stop
